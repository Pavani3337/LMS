<!DOCTYPE html>
<html>
<head>
    <title>CLMS Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginPage">
    <h2>Admin Login</h2>
    <input type="text" id="adminId" placeholder="Admin ID">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="branchPage" class="hidden">
    <h2>Select Branch</h2>

    <button onclick="showStudents('CSE')">CSE</button>
    <button onclick="showStudents('ECE')">ECE</button>
    <button onclick="showStudents('EEE')">EEE</button>
</div>

<div id="studentPage" class="hidden">

    <h2>Students</h2>

    <input
        type="text"
        id="searchBox"
        placeholder="Search Roll Number"
        onkeyup="searchStudent()">

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Full Name</th>
                <th>Roll Number</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>

</div>

<div id="profilePage" class="hidden">

    <h2>Student Profile</h2>

    <img
      src="https://via.placeholder.com/120"
      width="120">

    <h3 id="studentName"></h3>
    <p id="studentRoll"></p>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Book</th>
                <th>Author</th>
                <th>Issue Date</th>
                <th>Due Date</th>
            </tr>
        </thead>

        <tbody id="bookTable"></tbody>
    </table>

    <button onclick="issueBook()">Issue Book</button>

</div>

<script src="script.js"></script>

</body>
</html>
